# ==============================================================================
# docker-compose.yml: Cross-Silo Federated Learning Multi-Container Mesh
# ==============================================================================
# All 5 nodes share ONE pre-built image (fl-node:latest) and mount ./src directly.
# Start in 1 second with: docker compose up (WITHOUT --build)
# ==============================================================================

networks:
  fl-net:
    driver: bridge
    name: fl-net

services:
  # ----------------------------------------------------------------------------
  # 1. CENTRAL AGGREGATION SERVER & COORDINATOR
  # ----------------------------------------------------------------------------
  fl-server:
    image: fl-node:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fl-server
    hostname: fl-server
    command: ["python3", "-m", "src.systems.server_node"]
    ports:
      - "8080:8080"   # FL coordination & weight aggregation
      - "9090:9090"   # Prometheus telemetry exporter
    environment:
      - PYTHONUNBUFFERED=1
      - CONFIG_FILE=/app/configs/config.yaml
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./results:/app/results
    networks:
      - fl-net

  # ----------------------------------------------------------------------------
  # 2. HOSPITAL CLIENT: VINDR-MAMMO (Siemens Inspiration, Metro Profile)
  # ----------------------------------------------------------------------------
  client-vindr:
    image: fl-node:latest
    container_name: client-vindr
    hostname: client-vindr
    cap_add:
      - NET_ADMIN    # Required for Linux tc netem traffic shaping
    entrypoint: ["/entrypoint.sh"]
    command: ["python3", "-m", "src.systems.client_node", "--site", "vindr", "--server-host", "fl-server"]
    environment:
      - PYTHONUNBUFFERED=1
      - SITE_NAME=vindr
      - SERVER_HOST=fl-server
      - SERVER_PORT=8080
      - SERVER_ADDRESS=fl-server:8080
      - CONFIG_FILE=/app/configs/config.yaml
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data:ro
      - ./results:/app/results
    networks:
      - fl-net
    depends_on:
      - fl-server

  # ----------------------------------------------------------------------------
  # 3. HOSPITAL CLIENT: CMMD (GE Senographe, Metro Profile)
  # ----------------------------------------------------------------------------
  client-cmmd:
    image: fl-node:latest
    container_name: client-cmmd
    hostname: client-cmmd
    cap_add:
      - NET_ADMIN
    entrypoint: ["/entrypoint.sh"]
    command: ["python3", "-m", "src.systems.client_node", "--site", "cmmd", "--server-host", "fl-server"]
    environment:
      - PYTHONUNBUFFERED=1
      - SITE_NAME=cmmd
      - SERVER_HOST=fl-server
      - SERVER_PORT=8080
      - SERVER_ADDRESS=fl-server:8080
      - CONFIG_FILE=/app/configs/config.yaml
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data:ro
      - ./results:/app/results
    networks:
      - fl-net
    depends_on:
      - fl-server

  # ----------------------------------------------------------------------------
  # 4. HOSPITAL CLIENT: INBREAST (Siemens Novation, District Profile)
  # ----------------------------------------------------------------------------
  client-inbreast:
    image: fl-node:latest
    container_name: client-inbreast
    hostname: client-inbreast
    cap_add:
      - NET_ADMIN
    entrypoint: ["/entrypoint.sh"]
    command: ["python3", "-m", "src.systems.client_node", "--site", "inbreast", "--server-host", "fl-server"]
    environment:
      - PYTHONUNBUFFERED=1
      - SITE_NAME=inbreast
      - SERVER_HOST=fl-server
      - SERVER_PORT=8080
      - SERVER_ADDRESS=fl-server:8080
      - CONFIG_FILE=/app/configs/config.yaml
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data:ro
      - ./results:/app/results
    networks:
      - fl-net
    depends_on:
      - fl-server

  # ----------------------------------------------------------------------------
  # 5. HOSPITAL CLIENT: CDD-CESM (Low-Energy DM, District Profile)
  # ----------------------------------------------------------------------------
  client-cdd:
    image: fl-node:latest
    container_name: client-cdd
    hostname: client-cdd
    cap_add:
      - NET_ADMIN
    entrypoint: ["/entrypoint.sh"]
    command: ["python3", "-m", "src.systems.client_node", "--site", "cdd", "--server-host", "fl-server"]
    environment:
      - PYTHONUNBUFFERED=1
      - SITE_NAME=cdd
      - SERVER_HOST=fl-server
      - SERVER_PORT=8080
      - SERVER_ADDRESS=fl-server:8080
      - CONFIG_FILE=/app/configs/config.yaml
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./configs:/app/configs:ro
      - ./certs:/app/certs:ro
      - ./data:/app/data:ro
      - ./results:/app/results
    networks:
      - fl-net
    depends_on:
      - fl-server

  # ----------------------------------------------------------------------------
  # 6. GRAFANA LIVE TELEMETRY DASHBOARD (Optional UI)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: fl-grafana
    hostname: fl-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana_dashboard.json:/var/lib/grafana/dashboards/fl_dashboard.json:ro
    networks:
      - fl-net
    depends_on:
      - fl-server
